# Base de datos PostgreSQL para desarrollo local.
# Levantar: docker compose up -d   ·   Bajar: docker compose down
services:
  db:
    image: postgres:16-alpine
    container_name: matera-db
    environment:
      POSTGRES_USER: matera
      POSTGRES_PASSWORD: matera
      POSTGRES_DB: matera
    ports:
      - "5432:5432"
    volumes:
      - matera-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matera -d matera"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  matera-db-data:
